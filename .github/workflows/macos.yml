# macOS release gate: the full verification on the platform the native
# Seatbelt cell and the sealed install target.
name: macos

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

jobs:
  verify:
    name: macos verify (Bun 1.4.2)
    runs-on: macos-15
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v6

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2

      - name: Install JavaScript dependencies
        run: bun install --frozen-lockfile

      - name: Full verification gate
        run: bun run verify
